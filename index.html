<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>N-Queens Solver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3efe6;--ink:#17323a;--muted:#5d6f73;--light:#eadfc6;--dark:#2f6b6f;--queen:#b5322b;--panel:#fffaf0;--line:#d6cdb8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1f23;--ink:#eef0e6;--muted:#9db0b2;--light:#d9cba8;--dark:#2a6165;--queen:#ff6b5e;--panel:#162b30;--line:#2c4349}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1f23;--ink:#eef0e6;--muted:#9db0b2;--light:#d9cba8;--dark:#2a6165;--queen:#ff6b5e;--panel:#162b30;--line:#2c4349}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Fraunces",Georgia,serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:2rem;margin:0 0 4px;font-weight:700}
p.sub{margin:0 0 20px;color:var(--muted)}
.controls{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
label{display:flex;flex-direction:column;font-size:.9rem;color:var(--muted);gap:4px}
input{font:inherit;width:90px;padding:10px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
button{font:inherit;padding:10px 18px;border:0;border-radius:8px;background:var(--ink);color:var(--bg);cursor:pointer;font-weight:700}
button.alt{background:var(--panel);color:var(--ink);border:1.5px solid var(--line)}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--queen);outline-offset:2px}
.stat{margin:0 0 12px;font-size:1.1rem}
.board{display:grid;width:100%;aspect-ratio:1;border:2px solid var(--ink);border-radius:4px;overflow:hidden}
.cell{display:flex;align-items:center;justify-content:center;font-size:clamp(14px,6vw,38px);line-height:1;color:var(--queen)}
.cell.l{background:var(--light)}.cell.d{background:var(--dark)}
.nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px}
.nav span{color:var(--muted)}
.note{margin-top:22px;color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>N-Queens Solver</h1>
<p class="sub">Place N queens on an N × N board so none can attack another.</p>
<div class="controls">
<label>Board size (1–12)<input id="n" type="number" min="1" max="12" value="8" inputmode="numeric"></label>
<button id="go">Solve</button>
</div>
<p class="stat" id="stat">Press Solve to see every solution.</p>
<div class="board" id="board" aria-label="Chess board with queens"></div>
<div class="nav">
<button class="alt" id="prev" disabled>Previous</button>
<span id="pos"></span>
<button class="alt" id="next" disabled>Next</button>
</div>
<p class="note">Built with backtracking. Columns and both diagonals are tracked, so each safety check takes constant time.</p>
</main>
<script>
var sols=[],idx=0,N=8;
function solve(n){
  var res=[],pos=new Array(n),col=[],d1=[],d2=[];
  function go(r){
    if(r===n){res.push(pos.slice());return}
    for(var c=0;c<n;c++){
      if(col[c]||d1[r+c]||d2[r-c+n-1])continue;
      pos[r]=c;col[c]=d1[r+c]=d2[r-c+n-1]=true;
      go(r+1);
      col[c]=d1[r+c]=d2[r-c+n-1]=false;
    }
  }
  go(0);return res;
}
function draw(){
  var b=document.getElementById('board');
  b.style.gridTemplateColumns='repeat('+N+',1fr)';
  var h='';
  for(var r=0;r<N;r++)for(var c=0;c<N;c++){
    var q=sols.length&&sols[idx][r]===c;
    h+='<div class="cell '+((r+c)%2?'d':'l')+'">'+(q?'\u265B':'')+'</div>';
  }
  b.innerHTML=h;
  document.getElementById('pos').textContent=sols.length?('Solution '+(idx+1)+' of '+sols.length):'';
  document.getElementById('prev').disabled=!sols.length||idx===0;
  document.getElementById('next').disabled=!sols.length||idx===sols.length-1;
}
document.getElementById('go').onclick=function(){
  var v=parseInt(document.getElementById('n').value,10);
  if(!(v>=1&&v<=12)){document.getElementById('stat').textContent='Enter a size between 1 and 12.';return}
  N=v;sols=solve(N);idx=0;
  document.getElementById('stat').textContent=sols.length?('Total solutions: '+sols.length):('No solution exists for N = '+N+'.');
  draw();
};
document.getElementById('prev').onclick=function(){if(idx>0){idx--;draw()}};
document.getElementById('next').onclick=function(){if(idx<sols.length-1){idx++;draw()}};
draw();
</script>
</body>
</html>
